<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Terra em Realidade Aumentada</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>

</head>

<body>

<a-scene

mindar-image="
imageTargetSrc: targets.mind;
autoStart: true;
uiScanning: yes;
uiLoading: yes;
uiError: yes;"

embedded

color-space="sRGB"

renderer="colorManagement: true; physicallyCorrectLights"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false">

    <a-assets>

        <a-asset-item
            id="terra"
            src="terra.glb">
        </a-asset-item>

    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled:false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex:0">

        <a-gltf-model

            src="#terra"

            position="0 0 0"

            rotation="0 0 0"

            scale="0.2 0.2 0.2"

            animation-mixer>

        </a-gltf-model>

    </a-entity>

</a-scene>

</body>
</html>
