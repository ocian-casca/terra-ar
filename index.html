<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Model Viewer</title>

    <!-- Importa o componente -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

    <style>
        body{
            margin:0;
            background:#222;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        model-viewer{
            width:800px;
            height:600px;
        }
    </style>
</head>

<body>

<model-viewer
    src="PAINEL SOLAR.glb"
    alt="Meu modelo 3D"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">
</model-viewer>

</body>
</html>
